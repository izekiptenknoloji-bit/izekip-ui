# Written without being run: this repository's CI has not been exercised on GitHub yet.
name: ci

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure (D3D11, warnings are errors)
        run: cmake -S . -B build -DIZEKIP_TEST_GPU=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Headless tests
        working-directory: build
        run: ctest -C Release --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: GLFW and graphics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libvulkan-dev
      # dxc (shader compiler) ships only in the full LunarG SDK, not in the component builds that
      # setup-vulkan-sdk offers. The pinned version matches the one used for local Linux builds.
      - name: Vulkan SDK (provides dxc for shader compilation)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/vulkan-sdk.tar.xz" https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkan-sdk.tar.xz
          tar xf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$HOME"
          echo "VULKAN_SDK=$HOME/1.4.363.0/x86_64" >> "$GITHUB_ENV"
          echo "$HOME/1.4.363.0/x86_64/bin" >> "$GITHUB_PATH"
      - name: Configure (Vulkan, AddressSanitizer + UBSan)
        run: >
          cmake -S . -B build -DIZEKIP_RENDER_BACKEND=VULKAN -DIZEKIP_TEST_GPU=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Headless tests under sanitizers
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --output-on-failure
